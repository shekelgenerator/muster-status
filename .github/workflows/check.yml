# Checks Muster every 5 minutes and saves the results to the `data` branch,
# which the page reads. GitHub starts scheduled runs 30-45 minutes apart,
# not every 5, so each run stays up for 55 minutes and checks every 5 itself
# (a failure is rechecked a minute later). The schedule keeps one run waiting
# behind the current one, so the next starts as soon as this one ends.
name: Check Muster

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two runs never write the data branch together;
# later triggers wait (only the newest waiting one is kept).
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get the last results
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Starts empty only when the branch doesn't exist yet; any other failure
        # stops the run rather than wiping the history (M20, 23 Oct).
        run: sh fetch.sh "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data
      - name: Check every 5 minutes for 55 minutes, saving after each round
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node check.js data --for 55 --save save.sh
